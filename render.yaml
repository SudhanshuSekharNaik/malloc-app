services:
  # Fast, standalone FastAPI Web Application (serves Web UI + REST API + Docs)
  - type: web
    name: malloc-app
    env: python
    region: oregon
    plan: free
    buildCommand: pip install --no-cache-dir --upgrade pip && pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: DATABASE_URL
        value: sqlite:///./memora.db
